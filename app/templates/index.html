<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OrangeFlow centraliza y organiza solicitudes internas.">
  <meta name="theme-color" content="#f8fafc">
  <title>{{ app_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-route="dashboard" aria-label="OrangeFlow, inicio">
        <span class="brand-symbol"><i></i><i></i><i></i></span>
        <span><strong>OrangeFlow</strong><small>Gestión interna</small></span>
      </a>

      <nav class="nav" aria-label="Navegación principal">
        <p>ESPACIO DE TRABAJO</p>
        <button class="nav-link active" data-route="dashboard"><span data-icon="dashboard"></span>Dashboard</button>
        <button class="nav-link" data-route="requests"><span data-icon="inbox"></span>Solicitudes <b id="open-badge">0</b></button>
        <p>VISTAS RÁPIDAS</p>
        <button class="nav-link" data-route="mine"><span data-icon="user"></span>Asignadas a mí</button>
        <button class="nav-link" data-route="overdue"><span data-icon="clock"></span>Vencidas</button>
        <button class="nav-link" data-route="critical"><span data-icon="alert"></span>Críticas</button>
      </nav>

      <div class="sidebar-bottom">
        <a class="api-link" href="/docs" target="_blank"><span data-icon="code"></span>Explorar API</a>
        <div class="workspace">
          <span class="workspace-logo">OF</span>
          <span><small>Workspace</small><strong>Orange Company</strong></span>
          <span>⌄</span>
        </div>
      </div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-toggle" aria-label="Abrir menú"><span data-icon="menu"></span></button>
        <label class="top-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Buscar solicitudes..."><kbd>Ctrl K</kbd></label>
        <div class="top-profile">
          <span class="avatar avatar-orange">MS</span>
          <span><strong>Marina Suárez</strong><small>Administradora</small></span>
        </div>
        <button class="icon-btn notification" aria-label="Notificaciones"><span data-icon="bell"></span><i></i></button>
        <button class="button button-orange" data-new-request><span data-icon="plus"></span>Nueva solicitud</button>
      </header>
      <main id="content" tabindex="-1">
        <div class="loading"><span></span><p>Preparando OrangeFlow...</p></div>
      </main>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Detalle de solicitud"></aside>

  <dialog class="modal" id="create-modal">
    <form id="create-form">
      <header class="modal-head">
        <div><span class="kicker">NUEVA SOLICITUD</span><h2>Contanos qué necesitás</h2><p>Incluí el contexto necesario para que el equipo pueda actuar.</p></div>
        <button class="icon-btn" type="button" data-close-modal aria-label="Cerrar">×</button>
      </header>
      <div class="form-grid">
        <label class="span-2">Título<input name="title" minlength="4" maxlength="180" required placeholder="Ej. Alta de acceso al sistema contable"></label>
        <label class="span-2">Descripción<textarea name="description" minlength="10" maxlength="5000" rows="5" required placeholder="Describí la necesidad y el resultado esperado..."></textarea></label>
        <label>Categoría<select name="category_id" required></select></label>
        <label>Departamento solicitante<select name="requesting_department_id" required></select></label>
        <label>Prioridad<select name="priority"><option value="low">Baja</option><option value="medium" selected>Media</option><option value="high">Alta</option><option value="critical">Crítica</option></select></label>
        <label>Responsable<select name="assigned_user_id"><option value="">Sin asignar</option></select></label>
        <label class="span-2">Fecha límite<input type="date" name="due_at"></label>
      </div>
      <footer class="modal-actions"><button class="button button-ghost" type="button" data-close-modal>Cancelar</button><button class="button button-orange" type="submit"><span data-icon="send"></span>Crear solicitud</button></footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
